name: Oracle merged signal schedule

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'signal, daily, weekly, or monthly'
        required: true
        default: signal
        type: choice
        options:
          - signal
          - daily
          - weekly
          - monthly
  schedule:
    - cron: '0 */3 * * *'
    - cron: '5 0 * * *'
    - cron: '10 0 * * 0'
    - cron: '15 0 1 * *'

permissions:
  contents: write

concurrency:
  group: oracle-schedule
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MIN_CONFIDENCE: '55'
      RISK_REWARD: '2'
      MAX_HOLD_HOURS: '24'
      SIGNAL_SLOT_HOURS: '3'
    steps:
      - name: Checkout merged branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select scheduled mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 */3 * * *" ]]; then
            echo "mode=signal" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "10 0 * * 0" ]]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "15 0 1 * *" ]]; then
            echo "mode=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Oracle worker
        run: node worker/signal-worker.mjs --mode="${{ steps.mode.outputs.mode }}"

      - name: Commit signal journal and reports
        shell: bash
        run: |
          git config user.name 'oracle-merged-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No data changes to commit'
          else
            git commit -m "data: record oracle ${{ steps.mode.outputs.mode }} run"
            git push origin HEAD:main
          fi
